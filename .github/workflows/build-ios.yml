name: Build iPhone IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with an iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project LyricsCarPlay.xcodeproj -scheme LyricsCarPlay \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package app and Live Activity extension
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/LyricsCarPlay.app
          test -d "$APP/PlugIns/LyricsWidget.appex"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          /usr/bin/zip -qry LyricsCarPlay-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LyricsCarPlay-unsigned-IPA
          path: dist/LyricsCarPlay-unsigned.ipa
          retention-days: 7
