name: LyricsCarPlay
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LyricsCarPlay:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.lyricscarplay
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Lyrics for CarPlay
        CFBundleURLTypes:
          - CFBundleURLName: Spotify Login
            CFBundleURLSchemes:
              - lyricscarplay
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: LyricsWidget
        embed: true
    scheme: {}
  LyricsWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.lyricscarplay.LyricsWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
